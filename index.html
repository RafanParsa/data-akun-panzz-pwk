<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panzz Store - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans">
    <!-- Login Page -->
    <div id="loginPage" class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-blue-600 mb-2">Admin Panzz Store</h1>
                <p class="text-gray-500">Silakan login untuk mengelola data</p>
            </div>
            <form id="loginForm" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Username</label>
                    <input type="text" id="username" required class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm p-3 border focus:ring-blue-500 focus:border-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Password</label>
                    <input type="password" id="password" required class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm p-3 border focus:ring-blue-500 focus:border-blue-500 outline-none">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition shadow-lg">
                    Login Sekarang
                </button>
            </form>
        </div>
    </div>

    <!-- Main Content (Hidden by default) -->
    <div id="mainContent" class="hidden">
        <div class="max-w-4xl mx-auto p-4">
            <!-- Header -->
            <header class="flex justify-between items-center mb-6 bg-blue-600 p-4 rounded-lg shadow-lg text-white">
                <h1 class="text-2xl font-bold">Panzz Store 🎮</h1>
                <div class="flex gap-2">
                    <button onclick="downloadExcel()" class="bg-green-500 text-white px-4 py-2 rounded-full font-semibold hover:bg-green-600 transition" title="Download Excel">
                        <i class="fas fa-file-excel"></i>
                    </button>
                    <button onclick="toggleModal()" class="bg-white text-blue-600 px-4 py-2 rounded-full font-semibold hover:bg-blue-50 transition">
                        + Tambah Akun
                    </button>
                    <button onclick="handleLogout()" class="bg-red-500 text-white px-4 py-2 rounded-full font-semibold hover:bg-red-600 transition">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </header>

            <!-- Search & Filter -->
            <div class="mb-6 flex gap-2">
                <input type="text" id="searchInput" onkeyup="filterAccounts()" placeholder="Cari Kode Akun atau Gmail..." class="flex-1 p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button onclick="fetchAccounts()" class="bg-gray-200 text-gray-700 px-4 rounded-lg hover:bg-gray-300 transition" title="Refresh Data">
                    <i class="fas fa-sync-alt"></i>
                </button>
            </div>

            <!-- Accounts List -->
            <div id="accountsList" class="grid gap-4 md:grid-cols-2">
                <div class="col-span-full text-center py-10 text-gray-500">Memuat data...</div>
            </div>
        </div>

        <!-- Modal Form -->
        <div id="modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
            <div class="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden">
                <div class="bg-blue-600 p-4 text-white flex justify-between items-center">
                    <h2 id="modalTitle" class="text-lg font-bold">Tambah Akun Baru</h2>
                    <button onclick="toggleModal()" class="text-white hover:text-gray-200">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <form id="accountForm" class="p-6 space-y-4">
                    <input type="hidden" id="editOriginalKode">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Kode Akun</label>
                        <input type="text" name="Kode Akun" id="inputKode" required placeholder="ML-XXXX" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Gmail</label>
                        <input type="email" name="Gmail" required placeholder="example@gmail.com" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Pass Gmail</label>
                            <input type="text" name="Password Gmail" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Pass ML</label>
                            <input type="text" name="Password ML" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-blue-500 focus:border-blue-500">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Harga Beli</label>
                            <input type="number" name="Harga Beli" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Harga Jual</label>
                            <input type="number" name="Harga Jual" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-blue-500 focus:border-blue-500">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Keterangan</label>
                        <select name="Keterangan" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-blue-500 focus:border-blue-500">
                            <option value="Ready">Ready</option>
                            <option value="Sold">Sold</option>
                        </select>
                    </div>
                    <div class="pt-4">
                        <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition">Simpan Data</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        let accounts = [];

        // Auth Logic
        async function checkAuth() {
            try {
                const response = await fetch('/api/auth-status');
                const data = await response.json();
                if (data.loggedIn) {
                    showMainContent();
                } else {
                    showLoginPage();
                }
            } catch (error) {
                showLoginPage();
            }
        }

        function showMainContent() {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('mainContent').classList.remove('hidden');
            fetchAccounts();
        }

        function showLoginPage() {
            document.getElementById('loginPage').classList.remove('hidden');
            document.getElementById('mainContent').classList.add('hidden');
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (response.ok) {
                    showMainContent();
                    Swal.fire({
                        icon: 'success',
                        title: 'Selamat Datang!',
                        text: 'Berhasil masuk ke dashboard.',
                        timer: 1500,
                        showConfirmButton: false
                    });
                } else {
                    const data = await response.json();
                    const detailError = data.error ? `<br><small class="text-red-500">${data.error}</small>` : '';
                    const tip = data.tip ? `<br><small class="text-blue-500">${data.tip}</small>` : '';
                    
                    Swal.fire({
                        icon: 'error',
                        title: 'Login Gagal',
                        html: `${data.message}${detailError}${tip}`
                    });
                }
            } catch (error) {
                Swal.fire({
                    icon: 'error',
                    title: 'Kesalahan',
                    text: 'Terjadi kesalahan koneksi ke server'
                });
            }
        });

        async function handleLogout() {
            await fetch('/api/logout', { method: 'POST' });
            showLoginPage();
            Swal.fire({
                icon: 'info',
                title: 'Logged Out',
                text: 'Anda telah keluar dari sistem.',
                timer: 1500,
                showConfirmButton: false
            });
        }

        async function downloadExcel() {
            try {
                Swal.fire({
                    title: 'Menyiapkan Excel...',
                    didOpen: () => { Swal.showLoading(); }
                });

                const response = await fetch('/api/export-excel');
                if (response.status === 401) {
                    Swal.close();
                    return showLoginPage();
                }
                
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Data_Penjualan_PanzzStore_${new Date().toLocaleDateString()}.xlsx`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
                
                Swal.fire({
                    icon: 'success',
                    title: 'Berhasil!',
                    text: 'File Excel berhasil diunduh.',
                    timer: 1500,
                    showConfirmButton: false
                });
            } catch (error) {
                Swal.fire({
                    icon: 'error',
                    title: 'Download Gagal',
                    text: 'Gagal mendownload Excel'
                });
            }
        }

        function copyAccountInfo(kode) {
            const acc = accounts.find(a => String(a["Kode Akun"]).trim() === String(kode).trim());
            if (!acc) return Swal.fire('Error', 'Data tidak ditemukan', 'error');

            const text = `*INFORMASI AKUN*
*Kode Akun:* ${acc["Kode Akun"] || '-'}
*Email:* ${acc.Gmail || '-'}
*Password Google:* ${acc["Password Gmail"] || '-'}
*Password ML:* ${acc["Password ML"] || '-'}

*Notes:*
- Segera login dan mengganti Password
- Setelah mengamankan akun, lalu ss kirim ke admin "SS DONE"

*Keterangan:* ${acc.Keterangan || '-'}`;

            navigator.clipboard.writeText(text).then(() => {
                Swal.fire({
                    icon: 'success',
                    title: 'Disalin!',
                    text: 'Info akun berhasil disalin ke clipboard.',
                    timer: 1500,
                    showConfirmButton: false
                });
            }).catch(err => {
                Swal.fire('Error', 'Gagal menyalin teks', 'error');
            });
        }

        // Data Logic
        async function fetchAccounts() {
            try {
                const response = await fetch('/api/accounts');
                if (response.status === 401) return showLoginPage();
                accounts = await response.json();
                renderAccounts();
            } catch (error) {
                console.error('Error:', error);
            }
        }

        function renderAccounts(data = accounts) {
            const list = document.getElementById('accountsList');
            if (data.length === 0) {
                list.innerHTML = '<div class="col-span-full text-center py-10 text-gray-500">Tidak ada data ditemukan.</div>';
                return;
            }

            list.innerHTML = data.map((acc, index) => {
                const status = acc.Keterangan || "";
                
                return `
                <div class="bg-white rounded-xl shadow-md overflow-hidden border-l-4 ${status === 'Ready' ? 'border-green-500' : 'border-red-500'} p-4 relative">
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-xs font-bold uppercase tracking-wider text-gray-500">${acc["Kode Akun"]}</span>
                        <span class="px-2 py-1 text-xs font-bold rounded-full ${status === 'Ready' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">
                            ${status}
                        </span>
                    </div>
                    <h3 class="font-bold text-gray-800 truncate mb-1">${acc.Gmail || '-'}</h3>
                    <div class="text-sm text-gray-600 space-y-1 mb-4">
                        <p><span class="font-medium">Pass Gmail:</span> ${acc["Password Gmail"] || '-'}</p>
                        <p><span class="font-medium">Pass ML:</span> ${acc["Password ML"] || '-'}</p>
                        <div class="flex justify-between pt-2 border-t mt-2">
                            <p><span class="font-medium">Beli:</span> Rp${(acc["Harga Beli"] || 0).toLocaleString('id-ID')}</p>
                            <p><span class="font-medium">Jual:</span> Rp${(acc["Harga Jual"] || 0).toLocaleString('id-ID')}</p>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="handleEditAccount(${index})" class="flex-1 bg-gray-50 hover:bg-gray-100 text-gray-600 py-2 rounded text-sm font-semibold transition">
                            <i class="fas fa-edit mr-1"></i> Edit
                        </button>
                        <button onclick="handleToggleStatus(${index})" class="flex-1 bg-blue-50 hover:bg-blue-100 text-blue-600 py-2 rounded text-sm font-semibold transition">
                            Status
                        </button>
                        <button onclick="handleCopyInfo(${index})" class="px-3 bg-green-50 hover:bg-green-100 text-green-600 py-2 rounded transition" title="Salin Info Akun">
                            <i class="fas fa-copy"></i>
                        </button>
                        <button onclick="handleDeleteAccount(${index})" class="px-3 bg-red-50 hover:bg-red-100 text-red-600 py-2 rounded transition">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            `;}).join('');
        }

        // Fungsi pembantu agar tombol lebih stabil di semua device
        function handleToggleStatus(index) {
            const acc = accounts[index];
            toggleStatus(acc["Kode Akun"], acc.Keterangan);
        }

        function handleCopyInfo(index) {
            const acc = accounts[index];
            copyAccountInfo(acc["Kode Akun"]);
        }

        function handleDeleteAccount(index) {
            const acc = accounts[index];
            deleteAccount(acc["Kode Akun"]);
        }

        function filterAccounts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = accounts.filter(acc => 
                (acc["Kode Akun"] || "").toLowerCase().includes(query) || 
                (acc.Gmail || "").toLowerCase().includes(query)
            );
            renderAccounts(filtered);
        }

        function toggleModal() {
            const modal = document.getElementById('modal');
            const isHidden = modal.classList.contains('hidden');
            
            if (isHidden) {
                // Reset form to "Tambah" mode when opening empty
                document.getElementById('accountForm').reset();
                document.getElementById('modalTitle').innerText = 'Tambah Akun Baru';
                document.getElementById('editOriginalKode').value = '';
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
            }
        }

        function handleEditAccount(index) {
            const acc = accounts[index];
            const form = document.getElementById('accountForm');
            
            // Fill form with current data
            form.elements["Kode Akun"].value = acc["Kode Akun"];
            form.elements["Gmail"].value = acc.Gmail;
            form.elements["Password Gmail"].value = acc["Password Gmail"];
            form.elements["Password ML"].value = acc["Password ML"];
            form.elements["Harga Beli"].value = acc["Harga Beli"];
            form.elements["Harga Jual"].value = acc["Harga Jual"];
            form.elements["Keterangan"].value = acc.Keterangan;
            
            // Set hidden ID and change title
            document.getElementById('editOriginalKode').value = acc["Kode Akun"];
            document.getElementById('modalTitle').innerText = 'Edit Akun';
            
            // Show modal
            document.getElementById('modal').classList.remove('hidden');
        }

        async function toggleStatus(kode, currentStatus) {
            const newStatus = currentStatus === 'Ready' ? 'Sold' : 'Ready';
            try {
                const response = await fetch(`/api/accounts/${encodeURIComponent(kode)}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ Keterangan: newStatus })
                });
                if (response.ok) {
                    fetchAccounts();
                } else {
                    const data = await response.json();
                    Swal.fire('Gagal', 'Gagal ubah status: ' + data.message, 'error');
                }
            } catch (error) {
                Swal.fire('Error', 'Gagal mengubah status: Kesalahan koneksi', 'error');
            }
        }

        async function deleteAccount(kode) {
            Swal.fire({
                title: 'Apakah anda yakin?',
                text: `Akun ${kode} akan dihapus permanen!`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'Ya, Hapus!',
                cancelButtonText: 'Batal'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    try {
                        const response = await fetch(`/api/accounts/${encodeURIComponent(kode)}`, {
                            method: 'DELETE'
                        });
                        if (response.ok) {
                            Swal.fire({
                                icon: 'success',
                                title: 'Terhapus!',
                                text: 'Data akun berhasil dihapus.',
                                timer: 1500,
                                showConfirmButton: false
                            });
                            fetchAccounts();
                        } else {
                            const err = await response.json();
                            Swal.fire('Gagal', 'Gagal menghapus: ' + err.message, 'error');
                        }
                    } catch (error) {
                        Swal.fire('Error', 'Terjadi kesalahan koneksi', 'error');
                    }
                }
            });
        }

        document.getElementById('accountForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            data["Harga Beli"] = Number(data["Harga Beli"]);
            data["Harga Jual"] = Number(data["Harga Jual"]);

            const originalKode = document.getElementById('editOriginalKode').value;
            const isEdit = originalKode !== '';

            try {
                const url = isEdit ? `/api/accounts/${encodeURIComponent(originalKode)}` : '/api/accounts';
                const method = isEdit ? 'PUT' : 'POST';

                const response = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    e.target.reset();
                    toggleModal();
                    fetchAccounts();
                    Swal.fire({
                        icon: 'success',
                        title: isEdit ? 'Berhasil Update!' : 'Berhasil Simpan!',
                        text: isEdit ? 'Data akun telah diperbarui.' : 'Data akun baru telah ditambahkan.',
                        timer: 1500,
                        showConfirmButton: false
                    });
                } else {
                    const errorData = await response.json();
                    Swal.fire('Gagal', errorData.message, 'error');
                }
            } catch (error) {
                Swal.fire('Error', 'Gagal memproses data: Terjadi kesalahan koneksi', 'error');
            }
        });

        // Initial check
        checkAuth();
    </script>
</body>
</html>
