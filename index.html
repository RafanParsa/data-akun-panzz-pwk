<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panzz Store - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen font-sans">
    <!-- Login Page -->
    <div id="loginPage" class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-blue-600 mb-2">Admin Panzz Store</h1>
                <p class="text-gray-500">Silakan login untuk mengelola data</p>
            </div>
            <form id="loginForm" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Username</label>
                    <input type="text" id="username" required class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm p-3 border focus:ring-blue-500 focus:border-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Password</label>
                    <input type="password" id="password" required class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm p-3 border focus:ring-blue-500 focus:border-blue-500 outline-none">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition shadow-lg">
                    Login Sekarang
                </button>
            </form>
        </div>
    </div>

    <!-- Main Content (Hidden by default) -->
    <div id="mainContent" class="hidden">
        <div class="max-w-4xl mx-auto p-4">
            <!-- Header -->
            <header class="flex justify-between items-center mb-6 bg-blue-600 p-4 rounded-lg shadow-lg text-white">
                <h1 class="text-2xl font-bold">Panzz Store 🎮</h1>
                <div class="flex gap-2">
                    <button onclick="downloadExcel()" class="bg-green-500 text-white px-4 py-2 rounded-full font-semibold hover:bg-green-600 transition" title="Download Excel">
                        <i class="fas fa-file-excel"></i>
                    </button>
                    <button onclick="toggleModal()" class="bg-white text-blue-600 px-4 py-2 rounded-full font-semibold hover:bg-blue-50 transition">
                        + Tambah Akun
                    </button>
                    <button onclick="handleLogout()" class="bg-red-500 text-white px-4 py-2 rounded-full font-semibold hover:bg-red-600 transition">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </header>

            <!-- Search & Filter -->
            <div class="mb-6 flex gap-2">
                <input type="text" id="searchInput" onkeyup="filterAccounts()" placeholder="Cari Kode Akun atau Gmail..." class="flex-1 p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button onclick="fetchAccounts()" class="bg-gray-200 text-gray-700 px-4 rounded-lg hover:bg-gray-300 transition" title="Refresh Data">
                    <i class="fas fa-sync-alt"></i>
                </button>
            </div>

            <!-- Accounts List -->
            <div id="accountsList" class="grid gap-4 md:grid-cols-2">
                <div class="col-span-full text-center py-10 text-gray-500">Memuat data...</div>
            </div>
        </div>

        <!-- Modal Form -->
        <div id="modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
            <div class="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden">
                <div class="bg-blue-600 p-4 text-white flex justify-between items-center">
                    <h2 class="text-lg font-bold">Tambah Akun Baru</h2>
                    <button onclick="toggleModal()" class="text-white hover:text-gray-200">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <form id="accountForm" class="p-6 space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Kode Akun</label>
                        <input type="text" name="Kode Akun" required placeholder="ML-XXXX" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Gmail</label>
                        <input type="email" name="Gmail" required placeholder="example@gmail.com" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Pass Gmail</label>
                            <input type="text" name="Password Gmail" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Pass ML</label>
                            <input type="text" name="Password ML" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-blue-500 focus:border-blue-500">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Harga Beli</label>
                            <input type="number" name="Harga Beli" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Harga Jual</label>
                            <input type="number" name="Harga Jual" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-blue-500 focus:border-blue-500">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Keterangan</label>
                        <select name="Keterangan" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-blue-500 focus:border-blue-500">
                            <option value="Ready">Ready</option>
                            <option value="Sold">Sold</option>
                        </select>
                    </div>
                    <div class="pt-4">
                        <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition">Simpan Data</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        let accounts = [];

        // Auth Logic
        async function checkAuth() {
            try {
                const response = await fetch('/api/auth-status');
                const data = await response.json();
                if (data.loggedIn) {
                    showMainContent();
                } else {
                    showLoginPage();
                }
            } catch (error) {
                showLoginPage();
            }
        }

        function showMainContent() {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('mainContent').classList.remove('hidden');
            fetchAccounts();
        }

        function showLoginPage() {
            document.getElementById('loginPage').classList.remove('hidden');
            document.getElementById('mainContent').classList.add('hidden');
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (response.ok) {
                    showMainContent();
                } else {
                    const data = await response.json();
                    // Menampilkan error lebih detail agar kita tahu masalahnya
                    const detailError = data.error ? `\nDetail: ${data.error}` : '';
                    const tip = data.tip ? `\nTip: ${data.tip}` : '';
                    alert(`${data.message}${detailError}${tip}`);
                }
            } catch (error) {
                alert('Terjadi kesalahan koneksi ke server');
            }
        });

        async function handleLogout() {
            await fetch('/api/logout', { method: 'POST' });
            showLoginPage();
        }

        async function downloadExcel() {
            try {
                const response = await fetch('/api/export-excel');
                if (response.status === 401) return showLoginPage();
                
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Data_Penjualan_PanzzStore_${new Date().toLocaleDateString()}.xlsx`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
            } catch (error) {
                alert('Gagal mendownload Excel');
            }
        }

        function copyAccountInfo(kode) {
            const acc = accounts.find(a => String(a["Kode Akun"]).trim() === String(kode).trim());
            if (!acc) return alert('Data tidak ditemukan');

            const text = `*INFORMASI AKUN*
*Kode Akun:* ${acc["Kode Akun"] || '-'}
*Email:* ${acc.Gmail || '-'}
*Password Google:* ${acc["Password Gmail"] || '-'}
*Password ML:* ${acc["Password ML"] || '-'}

*Notes:*
- Segera login dan mengganti Password
- Setelah mengamankan akun, lalu ss kirim ke admin "SS DONE"

*Keterangan:* ${acc.Keterangan || '-'}`;

            navigator.clipboard.writeText(text).then(() => {
                alert('Info akun berhasil disalin!');
            }).catch(err => {
                alert('Gagal menyalin teks');
            });
        }

        // Data Logic
        async function fetchAccounts() {
            try {
                const response = await fetch('/api/accounts');
                if (response.status === 401) return showLoginPage();
                accounts = await response.json();
                renderAccounts();
            } catch (error) {
                console.error('Error:', error);
            }
        }

        function renderAccounts(data = accounts) {
            const list = document.getElementById('accountsList');
            if (data.length === 0) {
                list.innerHTML = '<div class="col-span-full text-center py-10 text-gray-500">Tidak ada data ditemukan.</div>';
                return;
            }

            list.innerHTML = data.map(acc => {
                const kodeAkun = acc["Kode Akun"] || "";
                const status = acc.Keterangan || "";
                
                return `
                <div class="bg-white rounded-xl shadow-md overflow-hidden border-l-4 ${status === 'Ready' ? 'border-green-500' : 'border-red-500'} p-4 relative">
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-xs font-bold uppercase tracking-wider text-gray-500">${kodeAkun}</span>
                        <span class="px-2 py-1 text-xs font-bold rounded-full ${status === 'Ready' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">
                            ${status}
                        </span>
                    </div>
                    <h3 class="font-bold text-gray-800 truncate mb-1">${acc.Gmail || '-'}</h3>
                    <div class="text-sm text-gray-600 space-y-1 mb-4">
                        <p><span class="font-medium">Pass Gmail:</span> ${acc["Password Gmail"] || '-'}</p>
                        <p><span class="font-medium">Pass ML:</span> ${acc["Password ML"] || '-'}</p>
                        <div class="flex justify-between pt-2 border-t mt-2">
                            <p><span class="font-medium">Beli:</span> Rp${(acc["Harga Beli"] || 0).toLocaleString('id-ID')}</p>
                            <p><span class="font-medium">Jual:</span> Rp${(acc["Harga Jual"] || 0).toLocaleString('id-ID')}</p>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="toggleStatus('${kodeAkun}', '${status}')" class="flex-1 bg-blue-50 hover:bg-blue-100 text-blue-600 py-2 rounded text-sm font-semibold transition">
                            Ubah Status
                        </button>
                        <button onclick="copyAccountInfo('${kodeAkun}')" class="px-3 bg-green-50 hover:bg-green-100 text-green-600 py-2 rounded transition" title="Salin Info Akun">
                            <i class="fas fa-copy"></i>
                        </button>
                        <button onclick="deleteAccount('${kodeAkun}')" class="px-3 bg-red-50 hover:bg-red-100 text-red-600 py-2 rounded transition">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            `;}).join('');
        }

        function filterAccounts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = accounts.filter(acc => 
                (acc["Kode Akun"] || "").toLowerCase().includes(query) || 
                (acc.Gmail || "").toLowerCase().includes(query)
            );
            renderAccounts(filtered);
        }

        function toggleModal() {
            const modal = document.getElementById('modal');
            modal.classList.toggle('hidden');
        }

        async function toggleStatus(kode, currentStatus) {
            const newStatus = currentStatus === 'Ready' ? 'Sold' : 'Ready';
            try {
                const response = await fetch(`/api/accounts/${encodeURIComponent(kode)}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ Keterangan: newStatus })
                });
                if (response.ok) {
                    fetchAccounts();
                } else {
                    const data = await response.json();
                    alert('Gagal ubah status: ' + data.message);
                }
            } catch (error) {
                alert('Gagal mengubah status: Kesalahan koneksi');
            }
        }

        async function deleteAccount(kode) {
            if (!confirm(`Hapus akun ${kode}?`)) return;
            try {
                const response = await fetch(`/api/accounts/${encodeURIComponent(kode)}`, {
                    method: 'DELETE'
                });
                if (response.ok) {
                    alert('Berhasil dihapus');
                    fetchAccounts();
                } else {
                    const err = await response.json();
                    alert('Gagal menghapus: ' + err.message);
                }
            } catch (error) {
                alert('Terjadi kesalahan koneksi');
            }
        }

        document.getElementById('accountForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            data["Harga Beli"] = Number(data["Harga Beli"]);
            data["Harga Jual"] = Number(data["Harga Jual"]);

            try {
                const response = await fetch('/api/accounts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                if (response.ok) {
                    e.target.reset();
                    toggleModal();
                    fetchAccounts();
                } else {
                    const errorData = await response.json();
                    alert('Gagal: ' + errorData.message);
                }
            } catch (error) {
                alert('Gagal menambah data: Terjadi kesalahan koneksi');
            }
        });

        // Initial check
        checkAuth();
    </script>
</body>
</html>
